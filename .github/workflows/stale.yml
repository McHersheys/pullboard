name: Close inactive clarification issues

on:
  schedule:
    - cron: '23 4 * * *'

permissions:
  issues: write
  pull-requests: read

jobs:
  close-clarification-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-issue-labels: clarify
          stale-issue-label: clarify-inactive
          days-before-issue-stale: 14
          days-before-issue-close: 0
          remove-issue-stale-when-updated: true
          close-issue-message: "Closing for now since we haven't heard back. Reply to reopen."
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-pr-stale-when-updated: false
